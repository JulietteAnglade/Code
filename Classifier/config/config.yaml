api:
  key: "nV75LrZdWH5h4mifv4rS56Ue87LZBj3D9h26S2Fh"
  base_url: "https://api.financialreports.eu/"

fetch:
  storage_dir: "data/raw_reports"
  n_companies: 100
  n_filings_per_company: 3
  n_files : 500
  filing_type_names:
    - "Quarterly Report"
    - "Annual Report"
  selected_companies_file: "companies.txt"

chunking:
  chunk_size: 2000
  overlap: 200
  output_dir: "data/chunks"

weak_labelling:
  categories:
    - "Legal boilerplate"
    - "Raw material related"
    - "Inflation related"
  llm_model: "mixtral"  # nom exact du modèle Ollama installé localement
  output_file: "data/weak_labels/weak_labels.json"
  multi_label_file: "data/weak_labels/multi_label_cases.json"

logging:
  level: "INFO"